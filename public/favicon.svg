<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="50%" stop-color="#0a0e24"/>
      <stop offset="100%" stop-color="#04050d"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="45%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Cyber C Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="40%" stop-color="#00d2ff"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Core Diamond Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f6ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Squircle Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Cyber Tech Background Accents -->
  <g opacity="0.25">
    <line x1="24" y1="28" x2="104" y2="28" stroke="#00f6ff" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="24" y1="100" x2="104" y2="100" stroke="#ff007f" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="24" cy="28" r="2.5" fill="#00f6ff"/>
    <circle cx="104" cy="28" r="2.5" fill="#00f6ff"/>
    <circle cx="24" cy="100" r="2.5" fill="#ff007f"/>
    <circle cx="104" cy="100" r="2.5" fill="#ff007f"/>
  </g>

  <!-- Glowing Outer Silhouette Glow for "C" -->
  <path d="M 88 36 L 48 36 L 28 56 L 28 72 L 48 92 L 88 92 L 96 82 L 56 82 L 42 68 L 42 60 L 56 46 L 96 46 Z" 
        fill="none" 
        stroke="url(#cyberGrad)" 
        stroke-width="5" 
        filter="url(#neonGlow)" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>

  <!-- Bold Cybernetic "C" (CYBERCHASE Emblem) -->
  <path d="M 88 36 L 48 36 L 28 56 L 28 72 L 48 92 L 88 92 L 96 82 L 56 82 L 42 68 L 42 60 L 56 46 L 96 46 Z" 
        fill="url(#cyberGrad)"/>

  <!-- Inner Tech Notch on "C" -->
  <polygon points="34,60 38,64 34,68 30,64" fill="#04050d"/>

  <!-- Central Radiant Diamond Core (Energy / Arcade Pellet / TechVerse Diamond) -->
  <g filter="url(#intenseGlow)">
    <polygon points="76,64 88,52 100,64 88,76" fill="url(#coreGrad)"/>
    <!-- Center Bright Highlight -->
    <circle cx="88" cy="64" r="3" fill="#ffffff"/>
  </g>

  <!-- Top-Right Speed/Laser Chevrons -->
  <path d="M 102 46 L 108 52 L 102 58" fill="none" stroke="#00f6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M 102 70 L 108 76 L 102 82" fill="none" stroke="#ff007f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
